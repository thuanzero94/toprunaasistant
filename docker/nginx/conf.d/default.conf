# ==============================================================================
# TOPRunAssistant - Nginx Reverse Proxy Configuration (Cloudflare + VPS)
# ==============================================================================

# 1. Frontend Web App (Next.js 15)
server {
    listen 80;
    server_name toprunassistant.io.vn www.toprunassistant.io.vn;

    client_max_body_size 50M;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Support Cloudflare True-Client-IP / CF-Connecting-IP
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 2. Backend REST API & Strava Webhook / OAuth2 (NestJS)
server {
    listen 80;
    server_name api.toprunassistant.io.vn;

    client_max_body_size 50M;

    location / {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}

