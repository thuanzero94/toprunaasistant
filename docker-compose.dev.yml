# ==============================================================================
# TOPRunAssistant - Development Docker Compose (HOT-RELOAD & INSTANT REFRESH)
# ==============================================================================
services:
  postgres:
    image: postgres:15-alpine
    container_name: toprun-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: ${POSTGRES_USER:-toprun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toprun_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-toprun_db}
    ports:
      - '5433:5432'
    volumes:
      - toprun_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-toprun} -d ${POSTGRES_DB:-toprun_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: toprun-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - toprun_redisdata:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: toprun-dev-api:latest
    container_name: toprun-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: development
      PORT: 4000
      DATA_DIR: /app/data
      PATH: /app/apps/web/node_modules/.bin:/app/apps/api/node_modules/.bin:/app/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
      DATABASE_URL: postgresql://${POSTGRES_USER:-toprun}:${POSTGRES_PASSWORD:-toprun_secret_2026}@postgres:5432/${POSTGRES_DB:-toprun_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-toprunassistant@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-ocyhhckxfwrnmdak}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3005}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000/api/v1}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:4000/api/v1/strava/callback}
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - ./packages/database:/app/packages/database
      - ./data:/app/data
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/database/node_modules
    command: npm run dev --workspace=@toprun/api

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: toprun-dev-web:latest
    container_name: toprun-web
    restart: unless-stopped
    ports:
      - '3005:3005'
    depends_on:
      - api
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: development
      PORT: 3005
      PATH: /app/apps/web/node_modules/.bin:/app/apps/api/node_modules/.bin:/app/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
      WATCHPACK_POLLING: 'true'
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/shared/node_modules
    command: npm run dev --workspace=@toprun/web

volumes:
  toprun_pgdata:
  toprun_redisdata:
